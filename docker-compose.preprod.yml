# Stack de preproduction — isolee de la production.
#
# Tourne sur la meme machine que la prod : le nom de projet, les noms de
# conteneurs et les volumes sont tous suffixes `-preprod`, et les ports publies
# sur l'hote sont decales par rapport a docker-compose.yml.
#
# Pas de service caddy ici : le Caddy de la stack de production est l'unique
# reverse proxy de l'hote (il detient 80/443) et sert aussi les domaines
# preprod.* via le reseau partage `badge_web`. Les ports publies ci-dessous ne
# servent qu'a l'acces direct / debug.
#
# Usage : make net-create (une fois), puis make preprod
# Requiert un fichier .env.preprod.

name: badge-preprod

services:
  app:
    container_name: badge-app-preprod
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3500:3000"
    env_file:
      - .env.preprod
    volumes:
      - uploads_data_preprod:/app/uploads
    networks:
      - default
      - web
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  phpmyadmin:
    container_name: badge-pma-preprod
    image: phpmyadmin:5
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    networks:
      - default
      - web
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    container_name: badge-db-preprod
    image: mysql:8
    env_file:
      - .env.preprod
    environment:
      MYSQL_DATABASE: badge
    volumes:
      - mysql_data_preprod:/var/lib/mysql
    ports:
      - "33061:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Stockage objet S3-compatible (cf. v4 Task 5.1). Contrairement a la prod,
  # les ports sont publies pour faciliter le debug de la preprod.
  minio:
    container_name: badge-minio-preprod
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env.preprod
    environment:
      # Console servie par le Caddy de prod en HTTPS sur le port standard.
      MINIO_BROWSER_REDIRECT_URL: https://preprod.s3.badge.bj
    ports:
      - "9002:9000"
      - "10001:9001"
    volumes:
      - minio_data_preprod:/data
    networks:
      - default
      - web
    restart: unless-stopped

  # Taches ponctuelles (seed, smoke tests, scripts) — cf. docker-compose.yml.
  # Stage `builder` : contient yarn, tsx, src/ et node_modules, absents du
  # runner standalone. Profile `tools` : jamais demarre par `up`.
  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env.preprod
    volumes:
      - uploads_data_preprod:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data_preprod:
  uploads_data_preprod:
  minio_data_preprod:

# Reseau partage avec la stack de production : c'est par la que le Caddy de
# prod joint les conteneurs preprod. `mysql` n'y est volontairement pas attache
# (aucune raison d'etre joignable depuis la prod).
networks:
  web:
    external: true
    name: badge_web
