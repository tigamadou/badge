# Stack de preproduction — isolee de la production.
#
# Tourne sur la meme machine que la prod : le nom de projet, les noms de
# conteneurs et les volumes sont tous suffixes `-preprod`, et les ports publies
# sur l'hote sont decales par rapport a docker-compose.yml.
#
# Pas de service caddy ici : le Caddy de la stack de production est l'unique
# reverse proxy de l'hote (il detient 80/443) et sert aussi les domaines
# preprod.* via le reseau partage `badge_web`. Les ports publies ci-dessous ne
# servent qu'a l'acces direct / debug.
#
# Usage : make net-create (une fois), puis make preprod
# Requiert un fichier .env.preprod.

name: badge-preprod

services:
  # Initialisation ponctuelle, relancee a chaque `up` : synchronise le schema
  # Prisma puis cree le SUPER_ADMIN (SEED_SUPER_ADMIN_*) si la base n'en a aucun.
  # Seul endroit du deploiement ou tourne `prisma db push`. `app` attend sa fin.
  init:
    container_name: badge-init-preprod
    # Image `tools` (stage builder) : contient prisma, tsx et src/.
    image: ${BADGE_IMAGE:-ghcr.io/tigamadou/badge}-tools:${BADGE_TAG:-preprod}
    env_file:
      - .env.preprod
    command: ["sh", "-c", "npx prisma db push --accept-data-loss && npx tsx prisma/seed-super-admin.ts"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  app:
    container_name: badge-app-preprod
    # Image construite et publiee sur GHCR par GitHub Actions (.github/workflows/deploy.yml).
    # BADGE_TAG est fixe par deploy.sh (sha du commit deploye) ; defaut : tag d'environnement.
    image: ${BADGE_IMAGE:-ghcr.io/tigamadou/badge}:${BADGE_TAG:-preprod}
    ports:
      - "3500:3000"
    env_file:
      - .env.preprod
    volumes:
      - uploads_data_preprod:/app/uploads
    networks:
      - default
      - web
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  phpmyadmin:
    container_name: badge-pma-preprod
    image: phpmyadmin:5
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    networks:
      - default
      - web
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    container_name: badge-db-preprod
    image: mysql:8
    env_file:
      - .env.preprod
    environment:
      MYSQL_DATABASE: badge
    volumes:
      - mysql_data_preprod:/var/lib/mysql
    ports:
      - "33061:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Stockage objet S3-compatible (cf. v4 Task 5.1). Contrairement a la prod,
  # les ports sont publies pour faciliter le debug de la preprod.
  # Console servie par le Caddy de prod sur preprod.s3.badge.bj.
  rustfs:
    container_name: badge-rustfs-preprod
    # RustFS remplace MinIO (plus distribue), cf. docker-compose.yml.
    # Identifiants : RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY dans .env.preprod.
    image: rustfs/rustfs:1.0.1-preview.16
    env_file:
      - .env.preprod
    environment:
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9002:9000"
      - "10001:9001"
    volumes:
      - rustfs_data_preprod:/data
    networks:
      - default
      - web
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Taches ponctuelles (seed, smoke tests, scripts) — cf. docker-compose.yml.
  # Stage `builder` : contient yarn, tsx, src/ et node_modules, absents du
  # runner standalone. Profile `tools` : jamais demarre par `up`.
  tools:
    profiles: ["tools"]
    # Stage `builder` publie a part sur GHCR (meme commit que `app`).
    image: ${BADGE_IMAGE:-ghcr.io/tigamadou/badge}-tools:${BADGE_TAG:-preprod}
    env_file:
      - .env.preprod
    volumes:
      - uploads_data_preprod:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data_preprod:
  uploads_data_preprod:
  rustfs_data_preprod:

# Reseau partage avec la stack de production : c'est par la que le Caddy de
# prod joint les conteneurs preprod. `mysql` n'y est volontairement pas attache
# (aucune raison d'etre joignable depuis la prod).
networks:
  web:
    external: true
    name: badge_web
