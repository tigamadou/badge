<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Badge — Aperçu badge</title>
<link rel="stylesheet" href="assets/badge.css" />
</head>
<body>
  <div class="public-page" data-screen-label="07 Aperçu badge">
    <div class="event-hero">
      <div class="inner"><span class="eh-logo">ST</span><div><h1>Votre badge</h1><div class="meta"><span>Salon Tech 2026</span><span>15–17 mars 2026</span></div></div></div>
    </div>
    <div class="public-narrow" style="max-width:560px;text-align:center;">
      <p class="ds-body" style="margin:0 0 24px;">Voici votre badge officiel. Présentez-le à l'entrée, imprimé ou sur votre téléphone.</p>

      <div style="display:flex;justify-content:center;margin-bottom:28px;">
        <div class="badge-card" style="box-shadow:var(--shadow-modal);">
          <div class="bc-band"></div>
          <div class="bc-top"><span class="org-logo" style="width:30px;height:30px;font-size:13px;">ST</span><span class="bc-org">Salon Tech 2026</span></div>
          <div class="bc-photo"><span data-ico="user" data-size="40"></span></div>
          <div class="bc-name">Camille Laurent</div>
          <div class="bc-role">Conférencière</div>
          <div class="bc-catband" style="background:#6366f1;">Conférencier</div>
          <div class="bc-foot"><span class="qr-box bc-qr"></span><div class="bc-meta">ID · 0241-8837<br/>15–17 mars 2026<br/>Paris Expo</div></div>
        </div>
      </div>

      <div style="display:flex;gap:12px;justify-content:center;">
        <button class="btn btn-primary"><span data-ico="download" data-size="16"></span> Télécharger le PDF</button>
        <button class="btn btn-secondary"><span data-ico="smartphone" data-size="16"></span> Ajouter au mobile</button>
      </div>
      <p class="help" style="margin-top:20px;">Format 100 × 140 mm · QR code unique vérifié à l'entrée.</p>
    </div>
  </div>
  <script src="assets/icons.js"></script>
</body>
</html>
