<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Badge — Mon profil</title>
<link rel="stylesheet" href="assets/badge.css" />
<style>
  .acct-top { display: flex; align-items: center; padding: 16px 28px; background: #fff; border-bottom: 1px solid var(--border-card); position: sticky; top: 0; z-index: 5; }
  .acct-top img { height: 28px; }
  .acct-top .sp { flex: 1; }
  .acct-top .nav { display: flex; gap: 4px; margin-left: 28px; }
  .acct-top .nav a { font-size: 14px; color: var(--fg2); text-decoration: none; padding: 7px 12px; border-radius: 8px; font-weight: 500; }
  .acct-top .nav a.on { background: var(--accent-nav-bg); color: var(--green-700); }
  .acct-top .nav a:hover { background: var(--slate-100); }
  .acct-wrap { max-width: 720px; margin: 0 auto; padding: 36px 24px 80px; }
</style>
</head>
<body>
  <div data-screen-label="10 Participant profil">
    <div class="acct-top">
      <img src="assets/logo.svg" alt="Badge" />
      <nav class="nav"><a href="participant-dashboard.html">Mes inscriptions</a><a class="on" href="participant-profil.html">Profil</a></nav>
      <span class="sp"></span>
      <div class="user-chip"><span class="nm" style="font-size:14px;color:var(--fg2);">Camille Laurent</span><span class="avatar">CL</span></div>
    </div>

    <div class="acct-wrap">
      <!-- Onboarding banner (variante compléter le profil) -->
      <div class="alert alert-info"><span data-ico="info" data-size="16" style="vertical-align:-3px;"></span> Complétez votre profil pour accélérer vos futures inscriptions. Champs manquants : téléphone, photo.</div>

      <div style="margin:8px 0 24px;">
        <h1 style="font-size:24px;font-weight:600;color:var(--fg1);margin:0 0 4px;">Mon profil</h1>
        <p class="ds-body">Ces informations sont réutilisées lors de vos inscriptions.</p>
      </div>

      <div class="card card-pad" style="margin-bottom:24px;">
        <div class="form-section" style="padding-top:0;">
          <h3>Identité</h3>
          <div style="display:flex;gap:20px;align-items:center;margin-bottom:18px;">
            <div class="bc-photo" style="width:72px;height:72px;margin:0;border-radius:50%;"><span data-ico="user" data-size="28"></span></div>
            <button class="btn btn-secondary btn-sm"><span data-ico="upload" data-size="15"></span> Changer la photo</button>
          </div>
          <div class="row-2">
            <div class="field"><label>Prénom</label><input class="input" value="Camille" /></div>
            <div class="field"><label>Nom</label><input class="input" value="Laurent" /></div>
          </div>
          <div class="row-2">
            <div class="field"><label>E-mail</label><input class="input" value="camille.laurent@exemple.fr" disabled /></div>
            <div class="field"><label>Téléphone <span class="req">*</span></label><input class="input" placeholder="06 12 34 56 78" style="border-color:var(--amber-700);box-shadow:0 0 0 2px var(--amber-200);" /></div>
          </div>
          <div class="field" style="margin-bottom:0;"><label>Organisation</label><input class="input" placeholder="Nom de votre organisation" /></div>
        </div>
        <div class="form-section" style="border-bottom:0;padding-bottom:0;">
          <h3>Changer le mot de passe</h3>
          <div class="field"><label>Mot de passe actuel</label><input class="input" type="password" placeholder="••••••••" /></div>
          <div class="row-2">
            <div class="field" style="margin-bottom:0;"><label>Nouveau mot de passe</label><input class="input" type="password" /></div>
            <div class="field" style="margin-bottom:0;"><label>Confirmer</label><input class="input" type="password" /></div>
          </div>
        </div>
      </div>

      <div class="between">
        <button class="btn-ghost-sm" style="color:var(--rose-700);border-color:var(--rose-200);">Supprimer mon compte</button>
        <div class="flex gap12"><button class="btn btn-secondary">Annuler</button><button class="btn btn-primary"><span data-ico="check" data-size="16"></span> Enregistrer</button></div>
      </div>
    </div>
  </div>
  <script src="assets/icons.js"></script>
</body>
</html>
