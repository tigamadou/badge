name: Build & Deploy Badge

# Release publiee -> prod ; pre-release -> preprod.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/tigamadou/badge

jobs:
  # Calcule l'environnement cible et le tag d'image a partir de la release.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Le tag part dans une commande SSH et un tag Docker : on refuse tout caractere exotique.
          echo "$TAG" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "::error::tag de release invalide : $TAG"; exit 1; }
          if [ "$PRERELEASE" = "true" ]; then target=preprod; else target=prod; fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Publie sur GHCR les deux images attendues par docker-compose : `app` (stage runner)
  # et `tools` (stage builder), taggees avec la release et l'environnement.
  build-and-push:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: '[ -n "$NPM_TOKEN" ] || { echo "::error::secret NPM_TOKEN manquant (read:packages)"; exit 1; }'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          secrets: npm_token=${{ secrets.NPM_TOKEN }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.resolve.outputs.tag }}
            ${{ env.IMAGE }}:${{ needs.resolve.outputs.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push tools
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          secrets: npm_token=${{ secrets.NPM_TOKEN }}
          tags: |
            ${{ env.IMAGE }}-tools:${{ needs.resolve.outputs.tag }}
            ${{ env.IMAGE }}-tools:${{ needs.resolve.outputs.target }}
          cache-from: type=gha

  deploy:
    needs: [resolve, build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.target }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: cd ~/${{ needs.resolve.outputs.target }}/badge && sh deploy.sh ${{ needs.resolve.outputs.target }} ${{ needs.resolve.outputs.tag }}
