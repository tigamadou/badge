services:
  # Unique reverse proxy de l'hote : sert la production ET la preproduction
  # (cf. Caddyfile). Il est le seul conteneur a detenir 80/443, ce qui permet
  # d'obtenir de vrais certificats Let's Encrypt pour les deux environnements.
  caddy:
    image: caddy:2-alpine
    container_name: badge-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - web
    depends_on:
      - app
      - phpmyadmin
    restart: unless-stopped

  # Initialisation ponctuelle, relancee a chaque `up` : synchronise le schema
  # Prisma puis cree le SUPER_ADMIN (SEED_SUPER_ADMIN_*) si la base n'en a aucun.
  # Seul endroit du deploiement ou tourne `prisma db push`. `app` attend sa fin.
  init:
    container_name: badge-init
    # Image `tools` (stage builder) : contient prisma, tsx et src/.
    image: ${BADGE_IMAGE:-ghcr.io/tigamadou/badge}-tools:${BADGE_TAG:-prod}
    env_file:
      - .env.production
    environment:
      BADGE_ENV: prod
      RENDERER_URL: http://badge-renderer:3000
    networks:
      - default
      - rendu
    command: ["sh", "-c", "npx prisma db push --accept-data-loss && npx tsx prisma/seed-super-admin.ts"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  # Service de rendu des badges (Chromium) : PDF, document fige, epreuve PNG. Jamais
  # expose : reseau `rendu` interne (sans acces sortant) partage avec app, init et
  # tools seulement. Le tag de l'image est toujours egal a la version du moteur
  # (@tigamadou/pdf-engine, package.json). Le HEALTHCHECK est celui de l'image.
  renderer:
    container_name: badge-renderer
    image: ghcr.io/tigamadou/pdf-engine-renderer:2.0.0
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [rendu]
    expose:
      - "3000"

  app:
    container_name: badge-app
    # Image construite et publiee sur GHCR par GitHub Actions (.github/workflows/deploy.yml).
    # BADGE_TAG est fixe par deploy.sh (sha du commit deploye) ; defaut : tag d'environnement.
    image: ${BADGE_IMAGE:-ghcr.io/tigamadou/badge}:${BADGE_TAG:-prod}
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      BADGE_ENV: prod
      RENDERER_URL: http://badge-renderer:3000
    volumes:
      - uploads_data:/app/uploads
    networks:
      - default
      - rendu
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      renderer:
        condition: service_healthy
    restart: unless-stopped

  # Worker de la queue d'emails (spec 23) : meme image que app, autre commande.
  worker:
    container_name: badge-worker
    image: ${BADGE_IMAGE:-ghcr.io/tigamadou/badge}:${BADGE_TAG:-prod}
    entrypoint: ["node", "worker.cjs"]
    env_file:
      - .env.production
    environment:
      BADGE_ENV: prod
      RENDERER_URL: http://badge-renderer:3000
    networks:
      - default
      - rendu
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      renderer:
        condition: service_healthy
    # Laisse le temps de finir les envois en cours (SEND_TIMEOUT_MS = 2 min au pire).
    stop_grace_period: 150s
    restart: unless-stopped

  phpmyadmin:
    container_name: badge-pma
    image: phpmyadmin:5
    expose:
      - "80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    container_name: badge-db
    image: mysql:8
    env_file:
      - .env.production
    environment:
      MYSQL_DATABASE: badge
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # v4 Task 5.1 : stockage objet S3-compatible. Aucun port publie sur Internet :
  # l'API S3 (9000) n'est joignable que via le reseau Docker interne (depuis
  # `app`), la console (9001) est servie par Caddy sur s3.badge.bj.
  rustfs:
    container_name: badge-rustfs
    # MinIO n'est plus distribue (images retirees de Docker Hub puis de quay.io) :
    # RustFS (Apache-2.0) le remplace, comme en dev. Tag fige : le projet n'en est
    # qu'aux preversions. Identifiants : RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY.
    image: rustfs/rustfs:1.0.1-preview.16
    env_file:
      - .env.production
    environment:
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Taches ponctuelles (seed, smoke tests, scripts). Utilise le stage `builder`
  # du Dockerfile, qui contient yarn, tsx, src/ et node_modules — tous absents
  # de l'image runner standalone. Le profile `tools` l'exclut de `up` : il ne
  # tourne que sur `docker compose run --rm tools ...`.
  tools:
    profiles: ["tools"]
    # Stage `builder` publie a part sur GHCR (meme commit que `app`).
    image: ${BADGE_IMAGE:-ghcr.io/tigamadou/badge}-tools:${BADGE_TAG:-prod}
    env_file:
      - .env.production
    environment:
      BADGE_ENV: prod
      RENDERER_URL: http://badge-renderer:3000
    volumes:
      - uploads_data:/app/uploads
    networks:
      - default
      - rendu
    depends_on:
      mysql:
        condition: service_healthy
      renderer:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
  caddy_data:
  caddy_config:
  rustfs_data:

# Reseau partage avec la stack de preproduction : seul `caddy` y est attache
# cote prod, ce qui lui permet de joindre les conteneurs preprod sans exposer
# les services de production. A creer une fois : `make net-create`.
networks:
  web:
    external: true
    name: badge_web
  # Reseau du service de rendu : interne, donc sans acces sortant ni vers Internet ni
  # vers les autres reseaux de l'hote.
  rendu:
    internal: true
