services:
  # Unique reverse proxy de l'hote : sert la production ET la preproduction
  # (cf. Caddyfile). Il est le seul conteneur a detenir 80/443, ce qui permet
  # d'obtenir de vrais certificats Let's Encrypt pour les deux environnements.
  caddy:
    image: caddy:2-alpine
    container_name: badge-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - web
    depends_on:
      - app
      - phpmyadmin
    restart: unless-stopped

  app:
    container_name: badge-app
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    env_file:
      - .env.production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  phpmyadmin:
    container_name: badge-pma
    image: phpmyadmin:5
    expose:
      - "80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    container_name: badge-db
    image: mysql:8
    env_file:
      - .env.production
    environment:
      MYSQL_DATABASE: badge
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # v4 Task 5.1 : stockage objet S3-compatible. Aucun port publie sur Internet ;
  # joignable uniquement via le reseau Docker interne (depuis `app`). Console 9001
  # accessible via tunnel SSH temporaire si besoin.
  minio:
    container_name: badge-minio
    # MinIO ne publie plus son image sur Docker Hub : `minio/minio` n'est plus
    # telechargeable. Le registre officiel est quay.io.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env.production
    environment:
      # Console derriere Caddy (HTTPS) : sans cette URL publique, MinIO redirige
      # vers son adresse interne et le login echoue.
      MINIO_BROWSER_REDIRECT_URL: https://s3.badge.bj
      # MINIO_SERVER_URL n'est pas defini : l'API S3 (9000) n'est jamais exposee
      # publiquement, `app` l'atteint en HTTP sur le reseau Docker interne.
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # Taches ponctuelles (seed, smoke tests, scripts). Utilise le stage `builder`
  # du Dockerfile, qui contient yarn, tsx, src/ et node_modules — tous absents
  # de l'image runner standalone. Le profile `tools` l'exclut de `up` : il ne
  # tourne que sur `docker compose run --rm tools ...`.
  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env.production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
  caddy_data:
  caddy_config:
  minio_data:

# Reseau partage avec la stack de preproduction : seul `caddy` y est attache
# cote prod, ce qui lui permet de joindre les conteneurs preprod sans exposer
# les services de production. A creer une fois : `make net-create`.
networks:
  web:
    external: true
    name: badge_web
