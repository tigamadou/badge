services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      secrets:
        - npm_token
    restart: unless-stopped
    ports:
      - "3785:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - docker/compose.dev.env
      - path: .env
        required: false
    environment:
      NPM_TOKEN: ${NPM_TOKEN}
      RENDERER_URL: http://renderer:3000
    networks: [default, rendu]
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      renderer:
        condition: service_healthy

  # Worker de la queue d'emails (spec 23) : meme image que app, polling court en dev
  # car expectMail (e2e/helpers/mailpit.ts) n'attend que 5 s.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
      secrets:
        - npm_token
    command: ["sh", "-c", "yarn install && yarn prisma generate && exec yarn tsx watch --clear-screen=false src/worker/index.ts"]
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - docker/compose.dev.env
      - path: .env
        required: false
    environment:
      NPM_TOKEN: ${NPM_TOKEN}
      JOB_POLL_INTERVAL_MS: "500"
      RENDERER_URL: http://renderer:3000
    networks: [default, rendu]
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
      renderer:
        condition: service_healthy

  # Service de rendu des badges (Chromium) : PDF, document fige, epreuve PNG.
  renderer:
    image: ghcr.io/tigamadou/pdf-engine-renderer:2.0.0
    # Image publiee en linux/amd64 seulement : emulee (Rosetta) sur Mac Apple Silicon.
    platform: linux/amd64
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [rendu]
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Le studio de construction de templates vit desormais dans le projet dedie
  # pdfStudio (../pdfStudio, http://pdfstudio.localhost).

  mysql:
    image: mysql:8
    ports:
      - "33060:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: badge
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  rustfs:
    # Stockage S3-compatible du dev. MinIO n'est plus distribue (images retirees de
    # Docker Hub puis de quay.io, binaires dl.min.io en 410) : RustFS (Apache-2.0)
    # le remplace. Tag fige : le projet n'en est qu'aux preversions.
    image: rustfs/rustfs:1.0.1-preview.16
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data_dev:/data
      - caddy_config_dev:/config
    depends_on:
      - app
      - phpmyadmin
      - mailpit

networks:
  rendu:
    internal: true

volumes:
  mysql_data:
  caddy_data_dev:
  caddy_config_dev:
  rustfs_data_dev:

secrets:
  # Jeton du registre GitHub Packages, lu dans l'environnement de l'hote (.env du
  # dossier de deploiement). Sert uniquement au build (yarn install).
  npm_token:
    environment: NPM_TOKEN
