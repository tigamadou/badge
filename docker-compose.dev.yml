services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      secrets:
        - npm_token
    restart: unless-stopped
    ports:
      - "3785:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - docker/compose.dev.env
      - path: .env
        required: false
    environment:
      NPM_TOKEN: ${NPM_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started

  # Le studio de construction de templates vit desormais dans le projet dedie
  # pdfStudio (../pdfStudio, http://pdfstudio.localhost).

  mysql:
    image: mysql:8
    ports:
      - "33060:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: badge
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    # MinIO ne publie plus son image sur Docker Hub : `minio/minio` n'est plus
    # telechargeable. Le registre officiel est quay.io.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Console derriere Caddy dev (https://s3.badge.local, tls internal).
      # L'acces direct http://localhost:9001 reste possible en parallele.
      MINIO_BROWSER_REDIRECT_URL: https://s3.badge.local
    volumes:
      - minio_data_dev:/data

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data_dev:/data
      - caddy_config_dev:/config
    depends_on:
      - app
      - phpmyadmin
      - mailpit

volumes:
  mysql_data:
  caddy_data_dev:
  caddy_config_dev:
  minio_data_dev:

secrets:
  # Jeton du registre GitHub Packages, lu dans l'environnement de l'hote (.env du
  # dossier de deploiement). Sert uniquement au build (yarn install).
  npm_token:
    environment: NPM_TOKEN
